[package]
name = "xdownload2"
version = "2.0.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui-phosphor = { version = "0.9", features = ["regular", "fill"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Windows SChannel TLS: no bundled crypto library to build or ship.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
# Clipboard text (the version eframe already uses).
arboard = { version = "3", default-features = false }
# Shell API for opening files and folders (already in the tree through eframe).
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry", "Win32_Foundation"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1"
